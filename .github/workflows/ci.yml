# Every change is tested before it reaches main, and main is tested again after merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  # The production image: builds, starts, serves page and API, and does not run as root.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nordic-onboarding .
      - run: docker run -d --name app -p 8080:8080 nordic-onboarding
      - run: scripts/smoke-test.sh http://localhost:8080
      - name: Runs as a non-root user
        run: |
          uid=$(docker exec app id -u)
          echo "runs as uid $uid"
          test "$uid" -ne 0
      - if: failure()
        run: docker logs app
