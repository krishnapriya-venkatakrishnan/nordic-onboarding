# Every change is tested before it reaches main; main is tested again after merge and, if green, deployed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a branch's older run, but never a main run, which may be mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  # The production image: builds, starts, serves page and API, and does not run as root.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nordic-onboarding .
      - run: docker run -d --name app -p 8080:8080 nordic-onboarding
      - run: scripts/smoke-test.sh http://localhost:8080
      - name: Runs as a non-root user
        run: |
          uid=$(docker exec app id -u)
          echo "runs as uid $uid"
          test "$uid" -ne 0
      - name: The synthetic sign-up succeeds in every market
        run: scripts/synthetic-signup.sh http://localhost:8080
      - name: Logs are JSON that Cloud Logging can read
        run: docker logs app 2>/dev/null | jq -e -s 'length > 0 and all(.[]; .severity and .message)'
      - name: The synthetic sign-up's events are tagged
        run: docker logs app 2>/dev/null | jq -e -s '[.[] | select(.logger == "onboarding")] | length > 0 and all(.synthetic == "true")'
      - name: The kill switch's check sees both markets live
        run: scripts/check-markets.sh http://localhost:8080 SE,DK
      - name: With MARKETS_ENABLED=SE, Denmark is dark
        run: |
          docker run -d --name sweden-only -p 8081:8080 -e MARKETS_ENABLED=SE nordic-onboarding
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8081/actuator/health
          scripts/check-markets.sh http://localhost:8081 SE DK
      - if: failure()
        run: docker logs app

  # The release and kill-switch scripts' logic, against a fake gcloud.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.test.sh
      - run: scripts/toggle-markets.test.sh

  # Green main ships: only after every check passes, and one deploy at a time.
  deploy:
    needs: [backend, frontend, container, scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets GitHub give Google a short-lived proof of "this repo, on main"
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: scripts/deploy.sh ${{ vars.GCP_PROJECT_ID }}
